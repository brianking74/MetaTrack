# Netlify deploy configuration - kept in version control so every deploy
# uses the same build settings (no hidden UI-only config).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22 is required: @supabase/supabase-js pulls @supabase/realtime-js,
  # which throws "native WebSocket not found" on Node < 22 the moment a
  # Supabase client is constructed (killed create-staff with a 502).
  NODE_VERSION = "22"

# Single-page app: always serve index.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
